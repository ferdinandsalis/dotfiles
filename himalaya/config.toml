# Himalaya Email Configuration (v2 format)
# https://github.com/pimalaya/himalaya

downloads-dir = "~/Downloads"

# =====================================
# Account: mail@ferdinandsalis.com
# =====================================
[accounts.ferdinandsalis]
default = true
email = "mail@ferdinandsalis.com"
display-name = "Ferdinand Salis"
signature = "-- \nFerdinand Salis\nmail@ferdinandsalis.com"

mailbox.alias.inbox = "INBOX"
mailbox.alias.sent = "Sent Items"
mailbox.alias.drafts = "Drafts"
mailbox.alias.trash = "Trash"

# IMAP
imap.server = "imap.fastmail.com"
imap.sasl.plain.username = "mail@ferdinandsalis.com"
imap.sasl.plain.password.command = "security find-generic-password -a mail@ferdinandsalis.com -s himalaya -w"

# SMTP
smtp.server = "smtp.fastmail.com"
smtp.sasl.plain.username = "mail@ferdinandsalis.com"
smtp.sasl.plain.password.command = "security find-generic-password -a mail@ferdinandsalis.com -s himalaya -w"

